name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show runtime
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and regression tests
        run: npm test

      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Run PostgreSQL job repository smoke
        run: npm run test:platform:integration

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Seed master data twice to prove idempotency
        run: npm run db:seed && npm run db:seed

      - name: Build application
        run: npm run build

      - name: Create isolated Phase 5 MEDC database
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/investai-phase5-medc-drma-regression'
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE p0a_phase5_medc;'

      - name: Download and checksum-lock official MEDC H1 2025 source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/investai-phase5-medc-drma-regression'
        run: |
          mkdir -p .phase5-source
          curl --fail --location --retry 3 --output .phase5-source/MEDC_1H25.pdf \
            https://www.medcoenergi.com/uploads/rwocis/532/MEDC_1H25.pdf
          echo "438675ac79b565ca4b583745bc2b2b885cf6b6fbbed8f71dcca51ef110cf880e  .phase5-source/MEDC_1H25.pdf" | sha256sum --check --strict

      - name: Apply migrations to isolated Phase 5 MEDC database
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/investai-phase5-medc-drma-regression'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p0a_phase5_medc?schema=public
        run: npx prisma migrate deploy

      - name: Run MEDC Phase 5 native roundtrip acceptance
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/investai-phase5-medc-drma-regression'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p0a_phase5_medc?schema=public
          P0A_MEDC_PDF_PATH: ${{ github.workspace }}/.phase5-source/MEDC_1H25.pdf
          P0A_PHASE5_OUTPUT_DIR: ${{ github.workspace }}/artifacts/phase5
        run: node --import tsx scripts/p0a-phase5-medc-roundtrip.ts

      - name: Upload MEDC actual compatibility artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/investai-phase5-medc-drma-regression' && success()
        uses: actions/upload-artifact@v4
        with:
          name: MEDC-PHASE5-P0A-ACTUAL
          path: artifacts/phase5/MEDC-PHASE5-P0A-ACTUAL.json
          if-no-files-found: error
