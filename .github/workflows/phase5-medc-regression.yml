name: Phase 5 MEDC Regression

on:
  pull_request:
    branches: [agent/investai-phase4-compatibility-qa-web]
    paths-ignore:
      - "artifacts/phase5/**"

permissions:
  contents: write

jobs:
  medc:
    if: github.event.pull_request.head.ref == 'agent/investai-phase5-medc-drma-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p0a_phase5_medc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p0a_phase5_medc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p0a_phase5_medc?schema=public
      P0A_MEDC_PDF_PATH: ${{ github.workspace }}/.phase5-source/MEDC_1H25.pdf
      P0A_PHASE5_OUTPUT_DIR: ${{ github.workspace }}/artifacts/phase5
    steps:
      - name: Checkout Phase 5 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download exact MEDC H1 2025 public source
        run: |
          mkdir -p .phase5-source
          curl --fail --location --retry 3 --output .phase5-source/MEDC_1H25.pdf \
            https://www.medcoenergi.com/uploads/rwocis/532/MEDC_1H25.pdf
          echo "438675ac79b565ca4b583745bc2b2b885cf6b6fbbed8f71dcca51ef110cf880e  .phase5-source/MEDC_1H25.pdf" | sha256sum --check --strict

      - name: Validate Prisma and apply migrations to disposable DB
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy

      - name: Run MEDC native extraction, persistence twice, and compatibility read
        run: node --import tsx scripts/p0a-phase5-medc-roundtrip.ts

      - name: Upload actual MEDC compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEDC-PHASE5-P0A-ACTUAL
          path: artifacts/phase5/MEDC-PHASE5-P0A-ACTUAL.json
          if-no-files-found: error

      - name: Commit actual MEDC artifact to Phase 5 branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/phase5/MEDC-PHASE5-P0A-ACTUAL.json
          if git diff --cached --quiet; then
            echo "Artifact unchanged; no commit required."
            exit 0
          fi
          git commit -m "phase5: record MEDC actual compatibility artifact"
          git push origin HEAD:agent/investai-phase5-medc-drma-regression
