name: Phase 5C OCR Compatibility

on:
  push:
    branches:
      - agent/investai-phase5c-ocr-compatibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5c-ocr:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://phase5c:phase5c@127.0.0.1:5432/p0a_phase5c_validate
      P0A_DRMA_PDF_PATH: ${{ github.workspace }}/.phase5-source/DRMA_Q4_2025.pdf
      P0A_PHASE5_OUTPUT_DIR: ${{ github.workspace }}/artifacts/phase5
    steps:
      - name: Checkout Phase 5C head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deterministic OCR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind
          tesseract --version
          pdftoppm -v
          tesseract --list-langs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Download and checksum-lock DRMA FY 2025 source
        run: |
          mkdir -p .phase5-source
          curl --http1.1 --fail --location --retry 3 --output .phase5-source/DRMA_Q4_2025.pdf 'https://www.indopremier.com/xdir/news/LAPORAN%20KEUANGAN/2025/q4/DRMA_Q4_2025.pdf'
          echo "7eedda5609f8c9936d1d68beb149c19620ac57a34098db29716bd3fb4c1e48fb  .phase5-source/DRMA_Q4_2025.pdf" | sha256sum --check --strict
      - name: Validate Prisma
        run: npx prisma validate
      - name: Type-check
        run: npm run typecheck
      - name: Run OCR-specific and full tests
        run: npm test
      - name: Run DRMA Phase 5C OCR diagnostic
        run: npx tsx scripts/p0a-phase5c-drma-diagnostic.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload DRMA Phase 5C OCR diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DRMA-PHASE5C-OCR-DIAGNOSTIC
          path: artifacts/phase5/DRMA-PHASE5C-OCR-DIAGNOSTIC.json
          if-no-files-found: error
