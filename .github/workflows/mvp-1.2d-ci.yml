name: MVP 1.2D CI

on:
  push:
    branches:
      - mvp-1.2d-pdf-ai-extraction
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public

      - name: Typecheck
        run: npx tsc --noEmit --pretty false
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public
