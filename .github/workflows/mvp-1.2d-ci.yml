name: MVP 1.2D CI

on:
  push:
    branches:
      - mvp-1.2d-pdf-ai-extraction
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investai?schema=public
